<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Farga FC</title>
  <meta name="theme-color" content="#0b0a09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="La Farga">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/escudo.webp" alt="Escudo de La Farga FC">
      <div>
        <h1>La Farga F.C.</h1>
        <p id="sub">Viernes · Grupo B</p>
      </div>
    </div>
    <button class="icon-btn" id="btn-ajustes" aria-label="Ajustes">⚙︎</button>
    <div id="cuenta" class="cuenta" hidden aria-live="off"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Secciones">
    <button data-tab="inicio" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Inicio</button>
    <button data-tab="partidos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Partidos</button>
    <button data-tab="tabla"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8"/></svg>Tabla</button>
    <button data-tab="plantilla"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.6c2 .6 3.2 2.6 3.6 5.4"/></svg>Plantilla</button>
    <button data-tab="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  </nav>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
